# Survivorship-bias-free S&P 500 universe study (point-in-time membership +
# delisted prices, 2010-01 to 2018-03 — see meridian/data/survivorship.py's
# KNOWN_PRICE_COVERAGE for the authoritative range and its remaining gaps).
#
# Setup once:
#   git clone https://github.com/teddykoker/survivorship-free-spy external/survivorship-free-spy
#   Then regenerate the price data against the full available range (widened from the
#   originally-shipped 2013-2018 slice — needs a free NASDAQ_DATA_LINK_API_KEY, see
#   data.nasdaq.com/account/api):
#     cd external/survivorship-free-spy/survivorship-free && python generate.py
# Run:
#   meridian universe configs/survivorship_spy.yaml
#
# Flip data.variant to measure the bias: "free" (point-in-time, bias-free) vs
# "survivor" (only the names still in the index at the end — the biased view).

experiment:
  name: spy-survivorship
  seed: 0

data:
  source: survivorship
  root: external/survivorship-free-spy/survivorship-free
  variant: free            # free | survivor
  start: 2010-01-04
  end: 2018-03-27
  field: close

estimators: [sma, ou, lsma, hull]
deviation: zscore
sizing: equal_weight
window: 20
cost_bps: 1.0

signal:
  entry_threshold: 1.5
  exit_threshold: 0.0

validation:
  mode: anchored
  min_train: 504           # ~2 years
  test_span: 126
  step: 126
  n_boot: 500
  n_mc: 300
  correction: bh

report:
  path: reports/survivorship_validation.md
