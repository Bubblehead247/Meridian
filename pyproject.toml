[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian"
version = "0.0.0"
description = "Comparative research platform for mean-reversion fair-value estimators"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Cody Lee", email = "codylee84@gmail.com" }]

dependencies = [
    # Data
    "yfinance>=0.2.40",
    "alpaca-py>=0.20",
    "financedatabase>=2.4",   # static symbol metadata for universe screening
    # Numerics
    "numpy>=1.26",
    "pandas>=2.2",
    # Stats
    "scipy>=1.13",
    "statsmodels>=0.14",
    # ML (PyTorch deferred to Phase 2 neural estimators)
    "scikit-learn>=1.5",
    # Visualization
    "plotly>=5.22",
    "matplotlib>=3.9",
    # Config
    "pyyaml>=6.0",
    # Experiment tracking
    "mlflow>=2.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.103",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["meridian*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
